name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release

      - name: Create release directory
        run: mkdir release

      - name: Copy artifacts
        run: |
          copy target\release\taskbar_audio.exe release\
          copy asset\config.json release\

      - name: Zip release
        run: |
          $version = "${{ github.ref_name }}".Replace('v', '')
          Compress-Archive -Path release\* -DestinationPath taskbar_audio_${version}_win64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: taskbar_audio_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}