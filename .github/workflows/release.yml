name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Sync Cargo Version From Tag
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $content = Get-Content Cargo.toml -Raw
          $content = $content -replace '(?m)^version\s*=\s*".*?"\s*$', "version = `"$version`""
          Set-Content Cargo.toml $content -Encoding UTF8
          Write-Host "Cargo.toml version synced to $version"
          cargo update --workspace
          if ($LASTEXITCODE -ne 0) { throw "Failed to sync workspace lockfile" }

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Create release directory
        run: mkdir release

      - name: Copy artifacts
        run: |
          copy target\release\taskbar_audio.exe release\
          copy asset\config.json release\

      - name: Zip release
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          Compress-Archive -Path release\* -DestinationPath taskbar_audio_${version}_win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskbar_audio_win64
          path: taskbar_audio_*.zip

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: TaskbarAudio ${{ github.ref_name }}
          artifacts: "taskbar_audio_*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
